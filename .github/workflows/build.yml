name: build

on:
  push:
    branches:
      - main
      - 'release/**'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: myusbip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MyUsbIP.slnx
      - name: Build
        run: dotnet build MyUsbIP.slnx -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project tests/MyUsbIP.SmokeTests/MyUsbIP.SmokeTests.csproj -c Release --no-build
      - name: Prepare pinned Windows dependencies for release
        if: matrix.rid == 'win-x64' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
        shell: pwsh
        run: ./scripts/windows/Install-Dependencies.ps1 -Role All -PrepareHash -FreezeHash -ForceDownload
      - name: Validate Windows dependency manifest
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if ('${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') }}' -eq 'true') {
            ./scripts/windows/Validate-Dependencies.ps1 -RequireCachedFiles
          } else {
            ./scripts/windows/Validate-Dependencies.ps1
          }
      - name: Publish CLI self-contained single file
        run: dotnet publish tools/MyUsbIP.Cli/MyUsbIP.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/${{ matrix.rid }}/cli
      - name: Publish Daemon self-contained single file
        run: dotnet publish apps/MyUsbIP.Daemon/MyUsbIP.Daemon.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/${{ matrix.rid }}/daemon
      - name: Prepare embedded Windows setup payload
        if: matrix.rid == 'win-x64' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
        shell: pwsh
        run: |
          $embed = 'tools/MyUsbIP.WindowsSetup/Embedded'
          Remove-Item $embed -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $embed | Out-Null
          Compress-Archive -Path 'artifacts/win-x64/daemon/*' -DestinationPath "$embed/server-payload.zip" -CompressionLevel Optimal
          Compress-Archive -Path 'artifacts/win-x64/cli/*' -DestinationPath "$embed/client-payload.zip" -CompressionLevel Optimal
          Copy-Item 'config/dependencies.windows.json' "$embed/dependencies.windows.json" -Force
          $cfg = Get-Content 'config/dependencies.windows.json' -Raw | ConvertFrom-Json
          $serverPkg = $cfg.packages | Where-Object { $_.enabled -eq $true -and $_.role -eq 'server' } | Select-Object -First 1
          $clientPkg = $cfg.packages | Where-Object { $_.enabled -eq $true -and $_.role -eq 'client' } | Select-Object -First 1
          if (-not $serverPkg -or -not $clientPkg) { throw '依赖清单缺少 server/client 包。' }
          Copy-Item (Join-Path 'dependencies/cache' $serverPkg.fileName) "$embed/server-dependency.bin" -Force
          Copy-Item (Join-Path 'dependencies/cache' $clientPkg.fileName) "$embed/client-dependency.bin" -Force
      - name: Publish Windows double-click setup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $setupRoot = 'artifacts/win-x64/setup'
          Remove-Item $setupRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $setupRoot | Out-Null

          dotnet publish tools/MyUsbIP.WindowsSetup/MyUsbIP.WindowsSetup.csproj -c Release -r win-x64 --self-contained true -p:SetupRole=server -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64/setup-server
          Copy-Item 'artifacts/win-x64/setup-server/MyUsbIP.Setup.exe' "$setupRoot/MyUsbIP-Server-Setup.exe" -Force

          dotnet publish tools/MyUsbIP.WindowsSetup/MyUsbIP.WindowsSetup.csproj -c Release -r win-x64 --self-contained true -p:SetupRole=client -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64/setup-client
          Copy-Item 'artifacts/win-x64/setup-client/MyUsbIP.Setup.exe' "$setupRoot/MyUsbIP-Client-Setup.exe" -Force
      - name: Build Windows deployment bundles
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if ('${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') }}' -eq 'true') {
            ./scripts/windows/Build-WindowsBundles.ps1 -IncludeCachedDependencies
          } else {
            ./scripts/windows/Build-WindowsBundles.ps1
          }
      - name: Report release artifact sizes
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Get-ChildItem 'artifacts/bundles' -File |
            Where-Object { $_.Extension -in @('.exe','.zip') } |
            Sort-Object Name |
            ForEach-Object { Write-Host ("[SIZE] {0} {1} bytes ({2:N2} MiB)" -f $_.Name, $_.Length, ($_.Length / 1MB)) }

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myusbip-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
      - name: Upload Windows bundles
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: myusbip-windows-bundles
          path: |
            artifacts/bundles/MyUsbIP-Server-Setup.exe
            artifacts/bundles/MyUsbIP-Client-Setup.exe
            artifacts/bundles/MyUsbIP-Server-win-x64.zip
            artifacts/bundles/MyUsbIP-Client-win-x64.zip
            artifacts/bundles/checksums.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_REF_NAME#release/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create Linux archive
        run: |
          cd release-artifacts
          zip -r ../myusbip-linux-x64.zip myusbip-linux-x64
      - name: Collect Windows release files
        run: |
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Server-Setup.exe .
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Client-Setup.exe .
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Server-win-x64.zip .
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Client-win-x64.zip .
          cp release-artifacts/myusbip-windows-bundles/checksums.sha256 .
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            MyUsbIP-Server-Setup.exe
            MyUsbIP-Client-Setup.exe
            MyUsbIP-Server-win-x64.zip
            MyUsbIP-Client-win-x64.zip
            myusbip-linux-x64.zip
            checksums.sha256
          )
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "MyUsbIP $RELEASE_TAG"
          fi
