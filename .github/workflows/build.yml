name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MyUsbIP.slnx
      - name: Build
        run: dotnet build MyUsbIP.slnx -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project tests/MyUsbIP.SmokeTests/MyUsbIP.SmokeTests.csproj -c Release --no-build
      - name: Publish CLI
        run: dotnet publish tools/MyUsbIP.Cli/MyUsbIP.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}/cli
      - name: Publish Daemon
        run: dotnet publish apps/MyUsbIP.Daemon/MyUsbIP.Daemon.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}/daemon
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myusbip-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
