name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: myusbip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MyUsbIP.slnx
      - name: Build
        run: dotnet build MyUsbIP.slnx -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project tests/MyUsbIP.SmokeTests/MyUsbIP.SmokeTests.csproj -c Release --no-build
      - name: Publish CLI
        run: dotnet publish tools/MyUsbIP.Cli/MyUsbIP.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}/cli
      - name: Publish Daemon
        run: dotnet publish apps/MyUsbIP.Daemon/MyUsbIP.Daemon.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}/daemon
      - name: Build Windows deployment bundles
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./scripts/windows/Build-WindowsBundles.ps1
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myusbip-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
      - name: Upload Windows bundles
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: myusbip-windows-bundles
          path: |
            artifacts/bundles/MyUsbIP-Server-win-x64.zip
            artifacts/bundles/MyUsbIP-Client-win-x64.zip
            artifacts/bundles/checksums.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create Linux archive
        run: |
          cd release-artifacts
          zip -r ../myusbip-linux-x64.zip myusbip-linux-x64
      - name: Collect Windows bundles
        run: |
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Server-win-x64.zip .
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Client-win-x64.zip .
          cp release-artifacts/myusbip-windows-bundles/checksums.sha256 .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          MyUsbIP-Server-win-x64.zip
          MyUsbIP-Client-win-x64.zip
          myusbip-linux-x64.zip
          checksums.sha256
          --generate-notes
          --title "MyUsbIP ${GITHUB_REF_NAME}"
