name: build

on:
  push:
    branches:
      - main
      - 'release/**'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: myusbip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MyUsbIP.slnx
      - name: Build
        run: dotnet build MyUsbIP.slnx -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project tests/MyUsbIP.SmokeTests/MyUsbIP.SmokeTests.csproj -c Release --no-build
      - name: Prepare pinned Windows dependencies for release
        if: matrix.rid == 'win-x64' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
        shell: pwsh
        run: ./scripts/windows/Install-Dependencies.ps1 -Role All -PrepareHash -FreezeHash -ForceDownload
      - name: Validate Windows dependency manifest
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if ('${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') }}' -eq 'true') {
            ./scripts/windows/Validate-Dependencies.ps1 -RequireCachedFiles
          } else {
            ./scripts/windows/Validate-Dependencies.ps1
          }
      - name: Publish CLI self-contained single file
        run: dotnet publish tools/MyUsbIP.Cli/MyUsbIP.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/${{ matrix.rid }}/cli
      - name: Publish Daemon self-contained single file
        run: dotnet publish apps/MyUsbIP.Daemon/MyUsbIP.Daemon.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/${{ matrix.rid }}/daemon
      - name: Publish Windows double-click setup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: dotnet publish tools/MyUsbIP.WindowsSetup/MyUsbIP.WindowsSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64/setup
      - name: Build Windows deployment bundles
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if ('${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') }}' -eq 'true') {
            ./scripts/windows/Build-WindowsBundles.ps1 -IncludeCachedDependencies
          } else {
            ./scripts/windows/Build-WindowsBundles.ps1
          }
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myusbip-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
      - name: Upload Windows bundles
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: myusbip-windows-bundles
          path: |
            artifacts/bundles/MyUsbIP-Server-win-x64.zip
            artifacts/bundles/MyUsbIP-Client-win-x64.zip
            artifacts/bundles/checksums.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_REF_NAME#release/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create Linux archive
        run: |
          cd release-artifacts
          zip -r ../myusbip-linux-x64.zip myusbip-linux-x64
      - name: Collect Windows bundles
        run: |
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Server-win-x64.zip .
          cp release-artifacts/myusbip-windows-bundles/MyUsbIP-Client-win-x64.zip .
          cp release-artifacts/myusbip-windows-bundles/checksums.sha256 .
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              MyUsbIP-Server-win-x64.zip \
              MyUsbIP-Client-win-x64.zip \
              myusbip-linux-x64.zip \
              checksums.sha256 \
              --clobber \
              --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" \
              MyUsbIP-Server-win-x64.zip \
              MyUsbIP-Client-win-x64.zip \
              myusbip-linux-x64.zip \
              checksums.sha256 \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "MyUsbIP $RELEASE_TAG"
          fi
